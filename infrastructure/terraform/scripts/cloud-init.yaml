#cloud-config
# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║                    AXONTIS - CLOUD-INIT PROVISIONING                         ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
# Ce script s'exécute automatiquement au premier démarrage du VPS
# Logs disponibles dans: /var/log/cloud-init-output.log

# ─────────────────────────────────────────────────────────────────────────────────
# CONFIGURATION SYSTÈME
# ─────────────────────────────────────────────────────────────────────────────────

# Définir le timezone
timezone: Europe/Paris

# Mettre à jour le hostname
hostname: axontis-prod
fqdn: axontis-prod.axontis.net

# ─────────────────────────────────────────────────────────────────────────────────
# PACKAGES À INSTALLER
# ─────────────────────────────────────────────────────────────────────────────────

package_update: true
package_upgrade: true

packages:
  # Essentiels
  - curl
  - wget
  - git
  - unzip
  - htop
  - vim
  - nano
  - ufw
  - fail2ban
  # Nginx
  - nginx
  # MySQL
  - mysql-server
  - mysql-client
  # PHP 8.5 et extensions
  - software-properties-common
  # Supervisor pour les queues
  - supervisor
  # Certbot pour SSL
  - certbot
  - python3-certbot-nginx
  # Node.js pour assets (optionnel)
  - nodejs
  - npm

# ─────────────────────────────────────────────────────────────────────────────────
# COMMANDES D'INSTALLATION
# ─────────────────────────────────────────────────────────────────────────────────

runcmd:
  # ═══════════════════════════════════════════════════════════════════════════════
  # INSTALLATION PHP 8.5
  # ═══════════════════════════════════════════════════════════════════════════════
  - add-apt-repository -y ppa:ondrej/php
  - apt-get update
  - apt-get install -y php8.5-fpm php8.5-cli php8.5-common php8.5-mysql php8.5-zip php8.5-gd php8.5-mbstring php8.5-curl php8.5-xml php8.5-bcmath php8.5-intl php8.5-readline php8.5-redis php8.5-tokenizer

  # ═══════════════════════════════════════════════════════════════════════════════
  # INSTALLATION COMPOSER
  # ═══════════════════════════════════════════════════════════════════════════════
  - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer

  # ═══════════════════════════════════════════════════════════════════════════════
  # CONFIGURATION MYSQL
  # ═══════════════════════════════════════════════════════════════════════════════
  - systemctl enable mysql
  - systemctl start mysql
  # Créer la base de données et l'utilisateur (mot de passe à changer!)
  - mysql -e "CREATE DATABASE IF NOT EXISTS axontis CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
  - mysql -e "CREATE USER IF NOT EXISTS 'axontis'@'localhost' IDENTIFIED BY 'CHANGE_ME_STRONG_PASSWORD';"
  - mysql -e "GRANT ALL PRIVILEGES ON axontis.* TO 'axontis'@'localhost';"
  - mysql -e "FLUSH PRIVILEGES;"

  # ═══════════════════════════════════════════════════════════════════════════════
  # CONFIGURATION NGINX
  # ═══════════════════════════════════════════════════════════════════════════════
  - systemctl enable nginx
  - rm -f /etc/nginx/sites-enabled/default

  # Créer la configuration Nginx pour Laravel
  - |
    cat > /etc/nginx/sites-available/axontis << 'NGINX'
    server {
        listen 80;
        listen [::]:80;
        server_name axontis.net www.axontis.net;
        root /var/www/axontis/public;

        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";

        index index.php;

        charset utf-8;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        error_page 404 /index.php;

        location ~ \.php$ {
            fastcgi_pass unix:/var/run/php/php8.5-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include fastcgi_params;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }

        # Gzip compression
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    }
    NGINX

  - ln -sf /etc/nginx/sites-available/axontis /etc/nginx/sites-enabled/
  - nginx -t && systemctl reload nginx

  # ═══════════════════════════════════════════════════════════════════════════════
  # CONFIGURATION PHP-FPM
  # ═══════════════════════════════════════════════════════════════════════════════
  - systemctl enable php8.5-fpm
  - systemctl start php8.5-fpm

  # Optimisations PHP pour production
  - sed -i 's/upload_max_filesize = .*/upload_max_filesize = 64M/' /etc/php/8.5/fpm/php.ini
  - sed -i 's/post_max_size = .*/post_max_size = 64M/' /etc/php/8.5/fpm/php.ini
  - sed -i 's/memory_limit = .*/memory_limit = 256M/' /etc/php/8.5/fpm/php.ini
  - sed -i 's/max_execution_time = .*/max_execution_time = 60/' /etc/php/8.5/fpm/php.ini
  - systemctl restart php8.5-fpm

  # ═══════════════════════════════════════════════════════════════════════════════
  # CONFIGURATION SUPERVISOR (pour les queues Laravel)
  # ═══════════════════════════════════════════════════════════════════════════════
  - systemctl enable supervisor
  - |
    cat > /etc/supervisor/conf.d/axontis-worker.conf << 'SUPERVISOR'
    [program:axontis-worker]
    process_name=%(program_name)s_%(process_num)02d
    command=php /var/www/axontis/artisan queue:work database --sleep=3 --tries=3 --max-time=3600
    autostart=true
    autorestart=true
    stopasgroup=true
    killasgroup=true
    user=www-data
    numprocs=2
    redirect_stderr=true
    stdout_logfile=/var/www/axontis/storage/logs/worker.log
    stopwaitsecs=3600
    SUPERVISOR

  # Configuration du scheduler Laravel (cron)
  - |
    cat > /etc/supervisor/conf.d/axontis-scheduler.conf << 'SCHEDULER'
    [program:axontis-scheduler]
    command=/bin/bash -c "while true; do php /var/www/axontis/artisan schedule:run --verbose --no-interaction; sleep 60; done"
    autostart=true
    autorestart=true
    user=www-data
    redirect_stderr=true
    stdout_logfile=/var/www/axontis/storage/logs/scheduler.log
    SCHEDULER

  # ═══════════════════════════════════════════════════════════════════════════════
  # CRÉATION DES DOSSIERS
  # ═══════════════════════════════════════════════════════════════════════════════
  - mkdir -p /var/www/axontis
  - chown -R www-data:www-data /var/www/axontis
  - chmod -R 755 /var/www/axontis

  # ═══════════════════════════════════════════════════════════════════════════════
  # CONFIGURATION FIREWALL (UFW)
  # ═══════════════════════════════════════════════════════════════════════════════
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow ssh
  - ufw allow http
  - ufw allow https
  - ufw --force enable

  # ═══════════════════════════════════════════════════════════════════════════════
  # CONFIGURATION FAIL2BAN
  # ═══════════════════════════════════════════════════════════════════════════════
  - systemctl enable fail2ban
  - systemctl start fail2ban

  # ═══════════════════════════════════════════════════════════════════════════════
  # CRÉATION UTILISATEUR DEPLOY (optionnel mais recommandé)
  # ═══════════════════════════════════════════════════════════════════════════════
  - useradd -m -s /bin/bash -G www-data,sudo deploy
  - mkdir -p /home/deploy/.ssh
  - cp /root/.ssh/authorized_keys /home/deploy/.ssh/
  - chown -R deploy:deploy /home/deploy/.ssh
  - chmod 700 /home/deploy/.ssh
  - chmod 600 /home/deploy/.ssh/authorized_keys
  - echo "deploy ALL=(ALL) NOPASSWD:ALL" >> /etc/sudoers.d/deploy

  # ═══════════════════════════════════════════════════════════════════════════════
  # MESSAGE FINAL
  # ═══════════════════════════════════════════════════════════════════════════════
  - echo "════════════════════════════════════════════════════════════════════════" >> /var/log/cloud-init-output.log
  - echo "PROVISIONING TERMINÉ - $(date)" >> /var/log/cloud-init-output.log
  - echo "════════════════════════════════════════════════════════════════════════" >> /var/log/cloud-init-output.log

# ─────────────────────────────────────────────────────────────────────────────────
# FICHIERS À ÉCRIRE
# ─────────────────────────────────────────────────────────────────────────────────

write_files:
  # Script de déploiement
  - path: /usr/local/bin/deploy-axontis.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -e

      echo "🚀 Déploiement Axontis..."
      cd /var/www/axontis

      # Pull des dernières modifications
      git pull origin main

      # Installation des dépendances
      composer install --no-dev --optimize-autoloader

      # Cache Laravel
      php artisan config:cache
      php artisan route:cache
      php artisan view:cache

      # Migrations
      php artisan migrate --force

      # Redémarrer les workers
      php artisan queue:restart
      supervisorctl restart axontis-worker:*

      echo "✅ Déploiement terminé!"

  # Script de rollback
  - path: /usr/local/bin/rollback-axontis.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -e

      if [ -z "$1" ]; then
        echo "Usage: rollback-axontis.sh <commit-hash>"
        exit 1
      fi

      echo "⏪ Rollback vers $1..."
      cd /var/www/axontis

      git checkout $1
      composer install --no-dev --optimize-autoloader
      php artisan config:cache
      php artisan route:cache
      php artisan view:cache
      php artisan queue:restart
      supervisorctl restart axontis-worker:*

      echo "✅ Rollback terminé!"

# ─────────────────────────────────────────────────────────────────────────────────
# REDÉMARRAGE FINAL
# ─────────────────────────────────────────────────────────────────────────────────

final_message: |
  ════════════════════════════════════════════════════════════════════════════════
  AXONTIS VPS PRÊT !

  Services installés:
  - Nginx (port 80/443)
  - PHP 8.5-FPM
  - MySQL 8
  - Supervisor (queues)
  - Fail2ban
  - UFW Firewall

  Prochaines étapes:
  1. Changer le mot de passe MySQL dans /var/www/axontis/.env
  2. Cloner le repo: git clone <repo> /var/www/axontis
  3. Configurer SSL: certbot --nginx -d axontis.net -d www.axontis.net
  4. Lancer: supervisorctl update && supervisorctl start all

  Logs cloud-init: /var/log/cloud-init-output.log
  ════════════════════════════════════════════════════════════════════════════════
